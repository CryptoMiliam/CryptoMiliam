name: Refresh profile activity
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Refresh aggregate contribution charts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py
      - name: Commit changed charts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg assets/contributions.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile contribution charts'
            git push
          fi
